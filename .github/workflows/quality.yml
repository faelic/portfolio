name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser regressions
        id: browser_tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure() && steps.browser_tests.outcome == 'failure'
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
