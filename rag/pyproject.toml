[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6,<7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "litellm>=1.109.0",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pandas>=3.1,<4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]
