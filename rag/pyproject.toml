[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
workbench = ["gradio>=6,<7", "pandas>=3.1,<4"]
notebooks = ["langchain-huggingface[full]>=1.2.3", "litellm>=1.109.0", "numpy>=2.5.4", "ipykernel>=7.4.0", "ipywidgets>=8.1.9"]
dev = [
    "pip-audit>=2.9,<3",
]
